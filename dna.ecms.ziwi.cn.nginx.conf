# dna.ecms.ziwi.cn — 独立租户实例 Nginx 配置（草稿，待上服务器）
# 部署目录: /var/www/dna/ecms  | 后端端口: 8089  | 前端 base: '/'

server {
    listen 80;
    server_name dna.ecms.ziwi.cn;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name dna.ecms.ziwi.cn;

    # 若 ziwi.cn 主证书为通配符(*.ziwi.cn)可直接复用；否则用 acme.sh 新签 dna.ecms.ziwi.cn
    ssl_certificate /etc/nginx/ssl/ziwi.cn.crt;
    ssl_certificate_key /etc/nginx/ssl/ziwi.cn.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /var/www/dna/ecms;

    # API 反向代理到独立后端(端口 8089)
    location /api/ {
        proxy_pass http://127.0.0.1:8089/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vue SPA 路由 fallback (base='/')
    location / {
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|webp|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-cache";
    }
}
